<!DOCTYPE html>
<!-- 파킹 페이지 (큰카드디자인) — 이 GitHub Pages는 운영 종료, moneybox-remit.com 으로 유도만 -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>머니박스레밋 · 공식 사이트 이전 안내</title>
  <link rel="icon" type="image/svg+xml" href="brand/assets/symbol.svg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root{--ink:#16213a;--bg:#eef1f6}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:clamp(18px,3vw,40px);min-height:100vh;display:flex;align-items:center}
    .wrap{max-width:1180px;margin:0 auto;width:100%}

    header{text-align:center;margin:6px 0 clamp(22px,3vw,36px)}
    header .logo{height:clamp(30px,4vw,42px);margin-bottom:18px}
    header .tag{display:inline-block;background:#fff;border:1px solid #d9e1ee;border-radius:999px;padding:7px 18px;font-size:clamp(13px,1.4vw,16px);font-weight:800;color:#3a465e;margin-bottom:16px}
    header h1{font-size:clamp(30px,5.4vw,54px);font-weight:900;letter-spacing:-.03em;line-height:1.15}
    header p{font-size:clamp(15px,1.7vw,20px);color:#5b6781;margin-top:14px;font-weight:600}
    header p b{color:#1553c8}

    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(16px,2vw,24px)}
    @media(max-width:720px){.cards{grid-template-columns:1fr}}

    .card{position:relative;display:flex;flex-direction:column;justify-content:flex-start;
      min-height:clamp(220px,25vw,290px);border-radius:26px;padding:clamp(26px,3vw,40px);
      text-decoration:none;color:#fff;overflow:hidden;
      box-shadow:0 10px 30px rgba(20,40,80,.16);transition:transform .16s ease,box-shadow .16s ease}
    .card:hover{transform:translateY(-6px);box-shadow:0 20px 46px rgba(20,40,80,.28)}
    .card .num{position:absolute;top:clamp(16px,2vw,26px);right:clamp(20px,2.4vw,32px);
      font-size:clamp(56px,8vw,104px);font-weight:900;line-height:1;color:rgba(255,255,255,.20)}
    .card .ic{font-size:clamp(40px,5vw,60px);line-height:1;margin-bottom:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.18))}
    .card h2{font-size:clamp(26px,3.4vw,40px);font-weight:900;letter-spacing:-.03em;margin:clamp(16px,2vw,22px) 0 clamp(8px,1vw,12px);line-height:1.18}
    .card p{font-size:clamp(15px,1.8vw,20px);font-weight:600;line-height:1.5;color:rgba(255,255,255,.94)}
    .card .go{margin-top:clamp(16px,2vw,22px);font-size:clamp(17px,2vw,23px);font-weight:900;letter-spacing:-.01em}

    .c1{background:linear-gradient(135deg,#1553c8,#3b82f6)}
    .c4{background:linear-gradient(135deg,#c2410c,#f97316)}

    footer{text-align:center;font-size:clamp(13px,1.4vw,15px);color:#8a95a8;margin-top:clamp(24px,3vw,38px);font-weight:600}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" src="brand/assets/horizontal-remit.svg" alt="MoneyBox Remit" />
      <div><span class="tag">📢 공식 사이트 이전 안내</span></div>
      <h1>이 페이지는 이전했습니다</h1>
      <p>머니박스레밋 공식 사이트가 <b>www.moneyboxremit.com</b> 으로 이전했습니다.<br>아래에서 공식 사이트로 이동해 주세요.</p>
    </header>

    <div class="cards">
      <a class="card c1" href="https://www.moneyboxremit.com">
        <span class="num">01</span>
        <span class="ic">🏠</span>
        <h2>공식 홈페이지</h2>
        <p>머니박스레밋 공식 사이트로 이동합니다.</p>
        <span class="go">www.moneyboxremit.com →</span>
      </a>
      <a class="card c4" href="https://moneybox-remit.com/remit/guide.html">
        <span class="num">02</span>
        <span class="ic">💸</span>
        <h2>송금 설명서</h2>
        <p>앱 가입부터 송금까지 단계별 설명서 (다국어).</p>
        <span class="go">설명서 열기 →</span>
      </a>
    </div>

    <footer>© 2026 MoneyBox Remit</footer>
  </div>
</body>
</html>
